name: Update register snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build snapshot
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node scripts/snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "register-bot"
          git config user.email "register-bot@users.noreply.github.com"
          git add data/register.json
          git diff --cached --quiet || (git commit -m "Update register snapshot" && git push)
